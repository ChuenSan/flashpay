# Template only. Replace sponsorship.example.com with the deployment's OWN domain.
# Use an existing valid production certificate for that domain; no test HTTPS certs.
# Install in nginx's http{} include directory. Audit all other/default server blocks too.
server {
    listen 80;
    listen [::]:80;
    server_name sponsorship.example.com;
    access_log off;
    # nginx error messages can contain client IPs, URIs and query strings.
    error_log /dev/null crit;
    location / {
        access_log off;
        return 308 https://sponsorship.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sponsorship.example.com;
    ssl_certificate /etc/letsencrypt/live/sponsorship.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sponsorship.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    access_log off;
    error_log /dev/null crit;
    server_tokens off;
    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # NO set_real_ip_from / real_ip_header here or inherited from http{}.
    # $remote_addr must be the actual TCP peer; direct nginx exposure is assumed.
    # A CDN/LB requires a separately audited allowlist and header rewrite policy.
    location / {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host sponsorship.example.com;
        proxy_set_header X-Forwarded-Host sponsorship.example.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        # Strip all alternative trust headers. Never use $proxy_add_x_forwarded_for.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_buffering off;
        # Prevent nginx from spilling private CSV/response/request bodies to temp files.
        proxy_max_temp_file_size 0;
        proxy_request_buffering off;
    }
}
