name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install and generate Prisma client
        run: npm ci && npm run db:generate
      - name: Check application
        run: npm run typecheck && npm run lint && npm test
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: flashpay:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify migration and HTTP startup without deployment secrets
        run: |
          docker run -d --name flashpay-smoke flashpay:smoke
          trap 'docker logs flashpay-smoke; docker rm -f flashpay-smoke' EXIT
          for attempt in $(seq 1 30); do
            echo "Checking container startup (${attempt}/30)"
            if docker exec flashpay-smoke node -e 'fetch("http://127.0.0.1:3000/").then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))'; then
              docker exec flashpay-smoke test -f /app/var/data/flashpay.db
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
